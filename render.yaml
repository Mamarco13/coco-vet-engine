# render.yaml — Configuración del servicio backend de C.O.C.O. en Render
# Documentación: https://render.com/docs/render-yaml-file
#
# IMPORTANTE: La variable GEMINI_API_KEY NO está aquí — se configura manualmente
# en el panel de Render (Dashboard → tu servicio → Environment → Add Environment Variable)
# para que nunca quede expuesta en el repositorio.

services:
  - type: web
    name: coco-backend
    runtime: python
    plan: free                    # Cambia a "starter" o superior si necesitas más recursos
    region: frankfurt             # Más cercano a España; otras opciones: oregon, ohio, singapore

    # Render ejecuta esto para instalar dependencias
    buildCommand: pip install -r backend/requirements.txt

    # Render ejecuta esto para arrancar el servidor
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT

    # Variables de entorno que NO son secretas (van en el YAML)
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # GEMINI_API_KEY se añade manualmente en el panel de Render.
      # Puedes marcarla como sincronizada desde un "Environment Group" de Render.
      # NO la pongas aquí para evitar exponerla.
