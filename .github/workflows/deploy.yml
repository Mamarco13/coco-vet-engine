name: Deploy C.O.C.O.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue simultáneo
concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════════
  # 1. TESTS DEL BACKEND
  # ══════════════════════════════════════════════════
  test:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        run: |
          cd backend
          python -m pytest tests/ -v

  # ══════════════════════════════════════════════════
  # 2. BUILD FRONTEND → exportación estática
  # ══════════════════════════════════════════════════
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (static export)
        working-directory: frontend
        env:
          # URL pública del backend en Render.
          # Configúrala en: GitHub repo → Settings → Secrets → Actions → NEXT_PUBLIC_API_BASE
          # Ejemplo: https://coco-backend.onrender.com
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NODE_ENV: production
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  # ══════════════════════════════════════════════════
  # 3. DESPLIEGUE FRONTEND → GitHub Pages
  # ══════════════════════════════════════════════════
  deploy-frontend:
    name: Deploy frontend (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ══════════════════════════════════════════════════
  # 4. REDESPLIEGUE BACKEND → Render
  # ══════════════════════════════════════════════════
  deploy-backend:
    name: Redeploy backend (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        # RENDER_DEPLOY_HOOK_URL se obtiene en:
        # Render Dashboard → tu servicio → Settings → Deploy Hook → Copy URL
        # Luego añádela en: GitHub repo → Settings → Secrets → Actions → RENDER_DEPLOY_HOOK_URL
        run: |
          curl -s --fail-with-body \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST